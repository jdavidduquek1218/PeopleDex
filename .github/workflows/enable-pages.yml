name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/peopledex-landing-page-cyijy8
    paths:
      - '.github/workflows/enable-pages.yml'

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    
    steps:
      - name: Configure GitHub Pages
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{
              "source": {
                "branch": "gh-pages",
                "path": "/"
              }
            }' || echo "Pages configuration already set or no permission"
      
      - name: Wait for Pages to be ready
        run: sleep 10
      
      - name: Verify Pages deployment
        run: |
          echo "✅ GitHub Pages configured for branch: gh-pages"
          echo "📍 Your landing page URL: https://${{ github.repository_owner }}.github.io/PeopleDex/"
